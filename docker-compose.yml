name: dublemint-promo

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      APP_ENV: local
    volumes:
      - .:/var/www
      - vendor_data:/var/www/vendor
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8090:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dublemint
      POSTGRES_USER: dublemint
      POSTGRES_PASSWORD: dublemint
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dublemint -d dublemint"]
      interval: 5s
      timeout: 5s
      retries: 10

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www
      - node_modules_data:/var/www/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  vendor_data:
  node_modules_data:
